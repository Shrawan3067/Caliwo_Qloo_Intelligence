version: "3.8"

# C7 fix: Production stack with PgBouncer connection pooling, multiple API
# replicas behind Nginx load balancer, and Redis for caching/rate-limiting/pubsub.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:caliwopass@pgbouncer:6432/caliwo}
      - DATABASE_READ_URL=${DATABASE_READ_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081,caliwo://}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - caliwo_net
    # Expose API port to the Docker network for Nginx
    expose:
      - "8000"
    # C7: Scale API replicas for horizontal scaling
    # Usage: docker compose -f docker-compose.prod.yml up --scale api=5
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # C1: PgBouncer connection pooler (transaction-mode) between app and PostgreSQL.
  # This prevents connection starvation under load. Each API worker connects to
  # PgBouncer (port 6432), which multiplexes a smaller pool of real DB connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-caliwopass}@db:5432/caliwo
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 100
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: plain
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caliwo_net

  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caliwopass}
      POSTGRES_DB: ${POSTGRES_DB:-caliwo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caliwo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # H8: Increase max_connections for read replicas and PgBouncer
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    networks:
      - caliwo_net

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caliwo_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - caliwo_net

volumes:
  pgdata:
  redisdata:

networks:
  caliwo_net:
    driver: bridge
