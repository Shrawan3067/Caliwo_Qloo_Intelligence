user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # C7 fix: Upstream with multiple API replicas for load balancing.
    # Docker Compose DNS resolves 'api' to all running container IPs.
    # Using least_conn for optimal distribution across replicas.
    # resolver 127.0.0.11 valid=10s enables dynamic DNS re-resolution
    # so Nginx discovers new API replicas as they scale up/down.
    upstream fastapi_app {
        least_conn;
        server api:8000;
        keepalive 32;
    }

    # Docker internal DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # H11: Proxy cache for static/media assets
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=60m;

    server {
        listen 80;
        server_name _;

        # Client body size limit for meal photo uploads (e.g. 15MB)
        client_max_body_size 15M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Request-ID $request_id always;

        # M4: Lightweight liveness probe — no burst limit, no rate limit
        location /health {
            proxy_pass http://fastapi_app/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            limit_req off;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # H11: Media files — cache at Nginx layer, add Cache-Control headers
        location /media/ {
            proxy_pass http://fastapi_app;
            proxy_cache media_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=3600, immutable";
            proxy_set_header Host $host;
        }

        # C4: Add Cache-Control hints for CDN-cacheable read endpoints
        location ~ ^/api/(steps/today|subscription/status|profile/me) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            add_header Cache-Control "private, max-age=15";
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket Support for Realtime Social Group Chat
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # C5: Increase WebSocket timeouts for long-lived connections
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
